# IFIRE Configuration
# Lines starting with # are comments.

[general]
# Network interface (leave empty for auto-detect)
interface =
promiscuous = false
quiet = false
capture_file =

[logging]
# JSON event log file
json_log = /var/log/ifire/ifire.jsonl
# Packet capture dump (pcap format)
pcap_log =

[ips]
# Set to true to enable automatic IP blocking via iptables
enabled = false
blacklist_file = /etc/ifire/blacklist.txt
whitelist_file = /etc/ifire/whitelist.txt

[detection]
# Enable/disable individual detection modules
arpspoof  = true
pingflood = true
portscan  = true
synflood  = true
tcptrack  = true
tftptrack = false
# TFTP server IP (required when tftptrack = true)
tftp_server =

[thresholds]
# Port scan: N unique destination ports within window_ms milliseconds
portscan_ports      = 15
portscan_window_ms  = 5000

# SYN flood: syn_count SYNs, SYN/SYN-ACK ratio >= ratio, within window_ms
synflood_syn_count  = 100
synflood_ratio      = 5.0
synflood_window_ms  = 10000

# Ping flood (tuned in pingflooddetector.c)
# pingflood_count     = 100
# pingflood_delay_ms  = 200
# pingflood_min_bytes = 1024

[ai]
# Run  python3 ai/ifire_ai.py --help  for usage
model_dir      = ai/models
watch_interval = 30
